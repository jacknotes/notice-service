name: CI

on:
  push:
    branches: [main]
    # 纯文档变更（README / CHANGELOG / docs / LICENSE 等）跳过整个 CI，
    # 不触发任何构建与测试；混有代码变更的提交仍会全量跑。
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'

jobs:
  # 检测本次变更涉及哪些模块，据此只跑相关的 job（避免每次全量构建）
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            frontend:
              - 'web/**'
            docker:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'web/**'
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'

  backend:
    name: Backend (Go)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notice_service
          MYSQL_USER: notice
          MYSQL_PASSWORD: notice123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -unotice -pnotice123 --silent; then
              echo "MySQL is up"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" && exit 1
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -p 1 ./... -count=1

  frontend:
    name: Frontend (Vue3)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx vue-tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build

  docker:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t notice-service:ci .
