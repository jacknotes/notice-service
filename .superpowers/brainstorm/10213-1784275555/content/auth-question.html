<h2>用户认证方式你倾向哪种？</h2>
<p class="subtitle">管理后台的登录方式</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>内置账号密码</h3>
      <p>系统自带用户注册/登录，独立运行，不依赖外部服务。简单直接，适合小团队</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>支持OAuth2/SSO</h3>
      <p>除了内置登录，还支持企业微信、钉钉、飞书等第三方登录。适合企业环境</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>先简单后迭代</h3>
      <p>第一版只做内置账号密码登录，后续再按需加入第三方登录</p>
    </div>
  </div>
</div>
