<h2>通知内容需要支持哪些形式？</h2>
<p class="subtitle">这决定了通知编辑器的复杂度</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>纯文本 + 模板变量</h3>
      <p>简单文本消息，支持变量替换（如用户名、时间）。最轻量，所有渠道都兼容</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Markdown 富文本</h3>
      <p>支持加粗、列表、链接等格式。邮箱可渲染，即时通讯渠道自动降级为纯文本</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>先简单后迭代</h3>
      <p>第一版支持纯文本 + 模板变量，后续再加 Markdown 支持</p>
    </div>
  </div>
</div>
