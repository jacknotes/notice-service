<h2>数据存储方案你倾向哪种？</h2>
<p class="subtitle">通知配置、发送记录、用户数据等需要持久化存储</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>SQLite</h3>
      <p>零配置、单文件数据库，资源占用极低，非常适合 Docker 单容器部署。中型团队规模完全够用</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>PostgreSQL</h3>
      <p>功能强大的关系型数据库，适合复杂查询和未来扩展。需要额外部署数据库容器</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>SQLite 优先，可切换</h3>
      <p>默认用 SQLite（最简部署），同时支持切换到 PostgreSQL。兼顾简单和扩展性</p>
    </div>
  </div>
</div>
