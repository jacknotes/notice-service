<h2>通知服务的使用规模是怎样的？</h2>
<p class="subtitle">这会影响技术选型和架构设计</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>个人/小团队使用</h3>
      <p>给自己或几个人发提醒，如定时任务提醒、日程提醒等。并发量极低，用户数 &lt; 10</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>部门/中型团队</h3>
      <p>几十到上百人使用，支持多人配置自己的通知渠道和提醒规则</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>公司级/大规模</h3>
      <p>几百到上千用户，需要考虑高并发、消息队列、限流等</p>
    </div>
  </div>
</div>
