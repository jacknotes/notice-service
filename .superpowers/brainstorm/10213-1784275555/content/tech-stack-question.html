<h2>你倾向的技术栈是什么？</h2>
<p class="subtitle">这会影响开发效率和资源占用</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Go + React</h3>
      <p>Go 单二进制，内存占用极低（~20MB），Docker镜像小。React 生态丰富，UI 表现力强。适合追求极致性能</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>Python FastAPI + Vue</h3>
      <p>Python 开发效率高，FastAPI 性能不错。Vue 对中文开发者友好，生态完善。内存占用中等</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>Node.js (Express) + React</h3>
      <p>前后端统一 JS/TS，开发效率最高。社区最活跃。内存占用相对较高，但中型团队规模完全够用</p>
    </div>
  </div>
</div>
