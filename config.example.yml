# Notice Service 配置文件示例
# 复制为 config.yml 使用；优先级：环境变量 > config.yml > 默认值
# 启动时可用 --config <path> 或 CONFIG_FILE 环境变量指定路径（默认 ./config.yml）

server:
  port: 8080

database:
  host: 127.0.0.1
  port: 3306
  user: notice
  password: notice123
  name: notice_service

jwt_secret: change-me
encrypt_key: "0123456789abcdef0123456789abcdef"

admin:
  user: admin
  pass: admin123

queue:
  workers: 4
  poll_ms: 1000
  max_attempts: 3
  retry_backoff: "5s,30s,60s"
  claim_ttl: 120
  job_retention_days: 30

log_retention_days: 90
audit_retention_days: 180

# 反向代理可信 CIDR（逗号分隔）；Webhook IP 白名单依赖它。
# 默认信任环回 + Docker 默认网桥网段（容器由宿主机 Nginx 反代时连接源是网桥网关）。
trusted_proxies: "127.0.0.1,::1,172.16.0.0/12"

# 是否暴露 /swagger API 文档
swagger_enabled: true

# encrypt_key_file: .notice-encrypt.key   # 渠道加密密钥文件路径（ENCRYPT_KEY 未设时读取/生成）
# static_dir: ./web/dist                  # 前端静态资源目录
