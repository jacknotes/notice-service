definitions:
  model.Channel:
    properties:
      category:
        type: string
      config:
        additionalProperties:
          type: string
        type: object
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  model.Task:
    properties:
      allowed_ips:
        items:
          type: string
        type: array
      api_key:
        type: string
      category:
        type: string
      channel_id:
        type: integer
      channel_ids:
        items:
          type: integer
        type: array
      created_at:
        type: string
      cron_expr:
        type: string
      enabled:
        type: boolean
      hmac_secret:
        type: string
      id:
        type: integer
      last_run_at:
        type: string
      name:
        type: string
      next_run_at:
        type: string
      receivers:
        items:
          type: string
        type: array
      require_signature:
        type: boolean
      template_id:
        type: integer
      trigger_type:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      variables:
        additionalProperties:
          type: string
        type: object
    type: object
  model.TaskLog:
    properties:
      category:
        description: 任务的当前分类（读取时 JOIN tasks 得到，不落库）
        type: string
      channel_id:
        type: integer
      content:
        type: string
      error_msg:
        type: string
      id:
        type: integer
      request:
        type: string
      response:
        type: string
      retry_count:
        type: integer
      sent_at:
        type: string
      status:
        type: string
      subject:
        type: string
      task_id:
        type: integer
      trigger_by:
        type: string
      trigger_ip:
        type: string
      trigger_type:
        type: string
    type: object
  model.Template:
    properties:
      category:
        type: string
      content_md:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      subject:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      variables:
        items:
          $ref: '#/definitions/model.TemplateVar'
        type: array
    type: object
  model.TemplateVar:
    properties:
      default:
        type: string
      description:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  service.BatchUser2FAResult:
    properties:
      id:
        type: integer
      otpauth_url:
        type: string
      recovery_codes:
        items:
          type: string
        type: array
      secret:
        type: string
      username:
        type: string
    type: object
  service.ExportBundle:
    properties:
      channels:
        items:
          $ref: '#/definitions/model.Channel'
        type: array
      exported_at:
        type: string
      tasks:
        items:
          $ref: '#/definitions/model.Task'
        type: array
      templates:
        items:
          $ref: '#/definitions/model.Template'
        type: array
      version:
        type: integer
    type: object
info:
  contact: {}
  description: 自托管通知发送服务 API（邮箱/企微/钉钉/飞书/PushPlus 多渠道投递）。
  title: Notice Service API
  version: 1.0.0
paths:
  /api/audit:
    get:
      parameters:
      - description: 关键词（匹配用户名/IP/详情）
        in: query
        name: keyword
        type: string
      - description: 操作类型（精确匹配）
        in: query
        name: action
        type: string
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 操作审计日志（仅管理员）
      tags:
      - 审计
  /api/auth/2fa/disable:
    post:
      consumes:
      - application/json
      parameters:
      - description: code
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 关闭双因子认证
      tags:
      - 认证
  /api/auth/2fa/enable:
    post:
      consumes:
      - application/json
      parameters:
      - description: code
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 启用双因子认证
      tags:
      - 认证
  /api/auth/2fa/setup:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 开启双因子认证：生成密钥与备用码
      tags:
      - 认证
  /api/auth/2fa/verify:
    post:
      consumes:
      - application/json
      parameters:
      - description: 待验证令牌与验证码
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 双因子验证（登录第二步）
      tags:
      - 认证
  /api/auth/change-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: 原/新密码
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 认证
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: 重置信息
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 用管理员生成的一次性令牌重置密码
      tags:
      - 认证
  /api/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录信息
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 账号密码登录；已启用 2FA 时返回待验证令牌
      tags:
      - 认证
  /api/auth/logout:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 退出登录
      tags:
      - 认证
  /api/auth/me:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取当前登录用户信息
      tags:
      - 认证
  /api/auth/profile:
    put:
      consumes:
      - application/json
      parameters:
      - description: 资料
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 修改自己的显示名/邮箱
      tags:
      - 认证
  /api/categories:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 共享分类列表
      tags:
      - 分类
    post:
      consumes:
      - application/json
      parameters:
      - description: 分类信息
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新增分类
      tags:
      - 分类
  /api/categories/{name}:
    delete:
      parameters:
      - description: 分类名称
        in: path
        name: name
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除分类
      tags:
      - 分类
    put:
      consumes:
      - application/json
      parameters:
      - description: 分类名称
        in: path
        name: name
        required: true
        type: string
      - description: 新名称
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重命名分类
      tags:
      - 分类
  /api/categories/unused:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      security:
      - BearerAuth: []
      summary: 未被引用的分类
      tags:
      - 分类
  /api/channels:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 渠道列表
      tags:
      - 渠道
    post:
      consumes:
      - application/json
      parameters:
      - description: 渠道配置
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新建渠道
      tags:
      - 渠道
  /api/channels/{id}:
    delete:
      parameters:
      - description: 渠道 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除渠道
      tags:
      - 渠道
    put:
      consumes:
      - application/json
      parameters:
      - description: 渠道 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 渠道配置
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新渠道
      tags:
      - 渠道
  /api/channels/{id}/test:
    post:
      parameters:
      - description: 渠道 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 测试渠道连通性
      tags:
      - 渠道
  /api/channels/batch-category:
    post:
      parameters:
      - description: ids + category
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量变更渠道分类
      tags:
      - 渠道
  /api/channels/batch-delete:
    post:
      parameters:
      - description: ids
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量删除渠道
      tags:
      - 渠道
  /api/channels/batch-toggle:
    post:
      parameters:
      - description: ids + enabled
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量启用/禁用渠道
      tags:
      - 渠道
  /api/dashboard/channel-stats:
    get:
      parameters:
      - description: 开始日期
        in: query
        name: from
        type: string
      - description: 结束日期
        in: query
        name: to
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 区间内各渠道投递统计
      tags:
      - 仪表盘
  /api/dashboard/stats:
    get:
      parameters:
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: to
        type: string
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 区间内投递统计（缺省近 7 天）
      tags:
      - 仪表盘
  /api/dashboard/top-tasks:
    get:
      parameters:
      - description: 开始日期
        in: query
        name: from
        type: string
      - description: 结束日期
        in: query
        name: to
        type: string
      - description: 返回条数（默认 5）
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 区间内发送量 TOP 任务
      tags:
      - 仪表盘
  /api/dashboard/trend:
    get:
      parameters:
      - description: 开始日期
        in: query
        name: from
        type: string
      - description: 结束日期
        in: query
        name: to
        type: string
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 区间内每日发送趋势
      tags:
      - 仪表盘
  /api/export:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ExportBundle'
      security:
      - BearerAuth: []
      summary: 导出渠道/模板/任务 JSON 备份
      tags:
      - 系统
  /api/import:
    post:
      consumes:
      - application/json
      parameters:
      - description: 备份内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/service.ExportBundle'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 导入渠道/模板/任务 JSON 备份
      tags:
      - 系统
  /api/instances:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 后端节点健康列表（多实例信号在线）
      tags:
      - 系统
  /api/logs:
    get:
      parameters:
      - description: 任务 ID
        in: query
        name: task_id
        type: integer
      - description: 状态 success/failed
        in: query
        name: status
        type: string
      - description: 分类（任务的当前分类）
        in: query
        name: category
        type: string
      - description: 开始日期 YYYY-MM-DD
        in: query
        name: from
        type: string
      - description: 结束日期 YYYY-MM-DD
        in: query
        name: to
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页数量
        in: query
        name: page_size
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 分页查询全部发送日志
      tags:
      - 任务
  /api/logs/{id}:
    get:
      parameters:
      - description: 日志 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TaskLog'
      security:
      - BearerAuth: []
      summary: 发送日志详情
      tags:
      - 任务
  /api/logs/{id}/retry:
    post:
      parameters:
      - description: 日志 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 重试失败日志（定向重发该条）
      tags:
      - 任务
  /api/logs/export:
    get:
      parameters:
      - description: 任务 ID
        in: query
        name: task_id
        type: integer
      - description: 状态
        in: query
        name: status
        type: string
      - description: 分类（任务的当前分类）
        in: query
        name: category
        type: string
      - description: 开始日期
        in: query
        name: from
        type: string
      - description: 结束日期
        in: query
        name: to
        type: string
      responses:
        "200":
          description: CSV
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: 导出发送日志 CSV（仅管理员）
      tags:
      - 任务
  /api/system/version:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 当前服务版本
      tags:
      - 系统
  /api/tasks:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 任务列表
      tags:
      - 任务
    post:
      consumes:
      - application/json
      parameters:
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 新建任务（仅管理员）
      tags:
      - 任务
  /api/tasks/{id}:
    delete:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 删除任务（仅管理员）
      tags:
      - 任务
    put:
      consumes:
      - application/json
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 任务信息
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 更新任务（仅管理员）
      tags:
      - 任务
  /api/tasks/{id}/logs:
    get:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: 查看某任务发送日志
      tags:
      - 任务
  /api/tasks/{id}/send:
    post:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 立即发送任务（入队，不依赖 cron；仅管理员）
      tags:
      - 任务
  /api/tasks/{id}/toggle:
    post:
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: integer
      - description: enabled
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 启用/停用任务（仅管理员）
      tags:
      - 任务
  /api/tasks/batch-category:
    post:
      parameters:
      - description: ids + category
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量变更任务分类
      tags:
      - 任务
  /api/tasks/batch-channels:
    post:
      parameters:
      - description: ids + channel_ids
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 批量变更任务投递渠道
      tags:
      - 任务
  /api/tasks/batch-delete:
    post:
      parameters:
      - description: ids
        in: body
        name: body
        required: true
        schema:
          type: object
      responses:
        "200":
          description: OK
